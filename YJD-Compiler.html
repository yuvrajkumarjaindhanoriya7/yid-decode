<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YJD Compiler</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:#0d1117;color:#e6edf3}
body{display:flex;flex-direction:column}
.top{height:52px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 12px;gap:10px}
.logo{font-weight:800;font-size:18px;color:#58a6ff;white-space:nowrap}.logo span{color:#e6edf3}
select,button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:7px 11px;cursor:pointer}
button:hover,select:hover{background:#30363d}.run{background:#238636;border-color:#2ea043;font-weight:700}.run:hover{background:#2ea043}
.spacer{flex:1}.status{font-size:12px;color:#8b949e}
.main{min-height:0;flex:1;display:flex;position:relative}
.editor{flex:1;min-width:0;position:relative}
#editor{position:absolute;inset:0}
.side{width:355px;min-width:260px;background:#0d1117;border-left:1px solid #30363d;display:flex;flex-direction:column}
.previewHead{height:38px;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #30363d;background:#161b22;font-size:13px;font-weight:700}
.previewHead .spacer{flex:1}.small{font-size:11px;padding:4px 7px}
.preview{height:48%;min-height:170px;background:white;border-bottom:1px solid #30363d}
#frame{width:100%;height:100%;border:0;background:white}
.consoleHead{height:34px;display:flex;align-items:center;padding:0 9px;background:#161b22;border-bottom:1px solid #30363d;font-size:12px;font-weight:700}
.console{flex:1;min-height:0;overflow:auto;padding:9px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;color:#c9d1d9}
.ok{color:#3fb950}.err{color:#f85149}.info{color:#79c0ff}
.bottom{height:30px;background:#161b22;border-top:1px solid #30363d;display:flex;align-items:center;padding:0 10px;font-size:11px;color:#8b949e}
#pyStatus{margin-left:auto}
@media(max-width:800px){.side{width:300px}.logo{font-size:15px}.status{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">YJD <span>Compiler</span></div>
  <select id="lang">
    <option value="html">HTML</option><option value="css">CSS</option><option value="javascript">JavaScript</option>
    <option value="python">Python</option><option value="swift">Swift</option>
  </select>
  <button class="run" id="run">▶ Run</button>
  <button id="save">💾 Save</button>
  <button id="clear">Clear</button>
  <div class="spacer"></div><div class="status" id="status">Ready</div>
</div>
<div class="main">
  <div class="editor"><div id="editor"></div></div>
  <aside class="side">
    <div class="previewHead"><span id="panelTitle">Live Preview</span><div class="spacer"></div><button class="small" id="refresh">↻</button><button class="small" id="expand">⛶</button></div>
    <div class="preview"><iframe id="frame" sandbox="allow-scripts allow-modals"></iframe></div>
    <div class="consoleHead">Console / Output</div>
    <div class="console" id="console"><span class="info">YJD Compiler ready.</span></div>
  </aside>
</div>
<div class="bottom"><span>Monaco Editor • YJD Compiler</span><span id="pyStatus"></span></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
require.config({paths:{vs:"https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs"}});
let editor, current="html";
const examples={
html:`<!DOCTYPE html>
<html>
<head><title>YJD</title></head>
<body>
  <h1>Hello from YJD Compiler 🚀</h1>
  <button onclick="document.querySelector('p').textContent='It works!'">Click me</button>
  <p>Live preview is running.</p>
</body>
</html>`,
css:`body {
  font-family: Arial;
  background: #111827;
  color: white;
  text-align: center;
  padding: 50px;
}
h1 { color: #58a6ff; }`,
javascript:`const message = "Hello from JavaScript!";
console.log(message);
document.body.innerHTML = "<h1>" + message + "</h1>";`,
python:`print("Hello from Python!")
for i in range(5):
    print("YJD", i)`,
swift:`import Foundation

print("Hello from Swift!")
`
};
require(["vs/editor/editor.main"],()=>{
  editor=monaco.editor.create(document.getElementById("editor"),{
    value:examples.html,language:"html",theme:"vs-dark",automaticLayout:true,
    minimap:{enabled:false},fontSize:14,tabSize:2,wordWrap:"on",
    scrollBeyondLastLine:false,smoothScrolling:true
  });
  editor.onDidChangeModelContent(()=>{document.getElementById("status").textContent="Modified"});
  runCode();
});
function setConsole(text,cls=""){const c=document.getElementById("console");c.innerHTML="";let s=document.createElement("span");s.className=cls;s.textContent=text;c.appendChild(s)}
function runCode(){
  if(!editor)return;
  const code=editor.getValue(); current=document.getElementById("lang").value;
  document.getElementById("status").textContent="Running…";
  if(current==="html"){document.getElementById("frame").srcdoc=code;setConsole("HTML preview updated.","ok");}
  else if(current==="css"){
    document.getElementById("frame").srcdoc=`<!doctype html><html><head><style>${code}</style></head><body><h1>CSS Live Preview</h1><p>Edit CSS in Monaco and press Run.</p><button>Sample Button</button></body></html>`;
    setConsole("CSS preview updated.","ok");
  } else if(current==="javascript"){
    document.getElementById("frame").srcdoc=`<!doctype html><html><body><div id="app"></div><script>${code.replace(/<\/script/gi,"<\\\\/script")}<\/script></body></html>`;
    setConsole("JavaScript preview updated. Console messages from the iframe may not be visible here.","ok");
  } else if(current==="python"){runPython(code);}
  else {setConsole("Swift needs a Swift compiler/backend. This editor is ready for a compiler API or local Swift toolchain.","info");document.getElementById("status").textContent="Swift backend required";}
  if(current!=="swift")document.getElementById("status").textContent="Ready";
}
async function runPython(code){
  setConsole("Loading Python runtime…","info");
  if(!window.loadPyodide){
    try{await new Promise((resolve,reject)=>{
      let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
    });}catch(e){setConsole("Could not load Pyodide. Check your internet connection.","err");return;}
  }
  try{
    window.pyodide=window.pyodide||await loadPyodide();
    let out=[];
    window.pyodide.setStdout({batched:(s)=>out.push(s)});
    window.pyodide.setStderr({batched:(s)=>out.push(s)});
    await window.pyodide.runPythonAsync(code);
    setConsole(out.join("")||"Program finished with no output.","ok");
  }catch(e){setConsole(String(e),"err")}
}
document.getElementById("run").onclick=runCode;
document.getElementById("refresh").onclick=runCode;
document.getElementById("lang").onchange=()=>{
  current=document.getElementById("lang").value;
  monaco.editor.setModelLanguage(editor.getModel(),current==="javascript"?"javascript":current);
  editor.setValue(localStorage.getItem("yjd_"+current)||examples[current]);
  document.getElementById("panelTitle").textContent=(current==="html"||current==="css"||current==="javascript")?"Live Preview":"Output";
  runCode();
};
document.getElementById("save").onclick=()=>{
  localStorage.setItem("yjd_"+current,editor.getValue());
  document.getElementById("status").textContent="Saved locally ✓";
};
document.getElementById("clear").onclick=()=>{setConsole("");document.getElementById("status").textContent="Cleared"};
document.getElementById("expand").onclick=()=>{
  document.querySelector(".side").style.width=document.querySelector(".side").style.width==="70%"?"355px":"70%";
};
</script>
</body>
</html>
